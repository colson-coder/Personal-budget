<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Babylon's Purse</title>
  <meta name="description" content="Budget, save, pay down debt and plan taxes — in any currency." />

  <!-- PWA manifest -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0a0e14" />

  <!-- iOS-specific install/standalone tags (iOS Safari ignores parts of the manifest) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Purse" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
  <link rel="icon" href="./icons/icon-192.png" />

  <!-- Paint the saved theme immediately (no flash). Default: Minimal Mono. -->
  <script>try{var t=localStorage.getItem('pb_theme')||'mono';if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'mono';document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='mono'}</script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app">
    <div class="boot">Loading…</div>
  </div>

  <!-- Entire app is ES modules; no build step. -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
